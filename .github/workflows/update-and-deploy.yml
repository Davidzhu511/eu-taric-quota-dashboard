name: Update EU and UK quota dashboards and deploy Pages

on:
  workflow_dispatch:
    inputs:
      recovery:
        description: Recover the latest due snapshot or Pages publication
        type: boolean
        default: false
  schedule:
    - cron: "50 7 * * *"
      timezone: Europe/Berlin
    - cron: "20 14 * * 1-5"
      timezone: Europe/Berlin
    # Extra inspections around the first allocations and carryover publication.
    - cron: "20 11 1-10,22-31 1,4,7,10 *"
      timezone: Europe/Berlin
    - cron: "10 16 1-10,22-31 1,4,7,10 *"
      timezone: Europe/Berlin
    - cron: "20 11 1-3 2,5,8,11 *"
      timezone: Europe/Berlin
    - cron: "10 16 1-3 2,5,8,11 *"
      timezone: Europe/Berlin
  push:
    branches: [main]
    paths:
      - "index.html"
      - "uk.html"
      - "scripts/build_english_pages.py"
      - "scripts/build_quarterly_summary.py"
      - "scripts/build_quota_events.py"
      - "scripts/dashboard_health.py"
      - "scripts/verify_live_site.py"
      - "scripts/write_publish_manifest.py"
      - "data/quota-policy.json"
      - "scripts/inject_uk_nav.py"
      - "scripts/update_dashboard.py"
      - "scripts/update_uk_dashboard.py"
      - "quarterly-summary.*"
      - "tests/test_english_build.py"
      - "tests/test_quarter_transition.py"
      - "tests/test_quarterly_summary.py"
      - "requirements.txt"
      - ".github/workflows/update-and-deploy.yml"
      - ".github/workflows/quota-freshness-watchdog.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: quota-dashboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      eu: ${{ steps.check.outputs.eu }}
      uk: ${{ steps.check.outputs.uk }}
      publish: ${{ steps.check.outputs.publish }}
      slot: ${{ steps.check.outputs.slot }}
    steps:
      - name: Check out latest main for daily deduplication
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Select the latest due Berlin refresh window
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          RECOVERY: ${{ inputs.recovery }}
        run: |
          args=()
          if [[ "$RECOVERY" == "true" ]]; then
            args+=(--verify-publication)
          elif [[ "$EVENT_NAME" != "schedule" ]]; then
            args+=(--force)
          fi
          python -m scripts.dashboard_health "${args[@]}" | tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"

  update-and-build:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      eu: ${{ steps.eu.outcome }}
      uk: ${{ steps.uk.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check quota parsing and quarter transitions
        run: python -m unittest discover -s tests -v

      - name: Preserve the preceding snapshots for comparison
        run: |
          mkdir -p "$RUNNER_TEMP/quota-before/uk"
          cp data/current.json data/quarterly-summary.json "$RUNNER_TEMP/quota-before/"
          cp data/uk/current.json "$RUNNER_TEMP/quota-before/uk/"

      - name: Fetch current EU TARIC quota data
        id: eu
        if: needs.schedule-gate.outputs.eu == 'true'
        continue-on-error: true
        timeout-minutes: 22
        run: python scripts/update_dashboard.py

      - name: Restore the last valid EU snapshot after a failed fetch
        if: steps.eu.outcome == 'failure'
        run: |
          git restore -- data/current.json data/history
          git clean -fd -- data/history

      - name: Fetch current UK Category 4 quota data
        id: uk
        if: needs.schedule-gate.outputs.uk == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/update_uk_dashboard.py

      - name: Restore the last valid UK snapshot after a failed fetch
        if: steps.uk.outcome == 'failure'
        run: |
          git restore -- data/uk
          git clean -fd -- data/uk

      - name: Validate generated dashboard data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          eu = json.loads(Path("data/current.json").read_text(encoding="utf-8"))
          eu_meta, eu_items = eu.get("meta", {}), eu.get("items", [])
          assert len(eu_items) == 55, f"expected 55 EU items, got {len(eu_items)}"
          assert eu_meta.get("total_count") == 55
          assert eu_meta.get("successful_count", 0) + eu_meta.get("failed_count", 0) == 55
          assert len({item.get("code") for item in eu_items}) == 55
          assert all(item.get("next_period") is None or item["next_period"].get("validity_period") for item in eu_items)

          uk = json.loads(Path("data/uk/current.json").read_text(encoding="utf-8"))
          uk_meta, uk_items = uk.get("meta", {}), uk.get("items", [])
          expected = ["058604", "058605", "058606", "058607", "058608"]
          assert [item.get("code") for item in uk_items] == expected
          assert uk_meta.get("jurisdiction") == "UK"
          assert uk_meta.get("total_count") == 5
          assert uk_meta.get("successful_count", 0) + uk_meta.get("failed_count", 0) == 5
          assert next(item for item in uk_items if item.get("code") == "058608").get("china_uses_this_pool") is True
          assert len(uk.get("next_items", [])) in (0, 5)
          assert all(item.get("balance") is None for item in uk.get("next_items", []) if item.get("status") == "Future")
          print(f"validated EU {len(eu_items)} and UK {len(uk_items)} quota records")
          PY

      - name: Preserve opening evidence and prepare the business change feed
        run: |
          python scripts/build_quarterly_summary.py --previous "$RUNNER_TEMP/quota-before/current.json"
          python scripts/build_quota_events.py --previous-dir "$RUNNER_TEMP/quota-before"

      - name: Save current data and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current.json data/history data/uk data/quarterly-summary.json data/quota-events.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update EU and UK quota snapshots"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then
                break
              fi
              if [[ "$attempt" -eq 3 ]]; then
                exit 1
              fi
            done
          fi

      - name: Prepare static site
        run: |
          mkdir -p _site/data _site/cbam
          cp index.html _site/index.html
          cp uk.html _site/uk.html
          python scripts/inject_uk_nav.py _site/index.html
          cp quarterly-summary.js quarterly-summary.css _site/
          python scripts/build_english_pages.py _site
          cp -R data/. _site/data/
          cp -R cbam/. _site/cbam/
          touch _site/.nojekyll
          python scripts/write_publish_manifest.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # A forced job rerun belongs to a new run attempt but keeps prior
          # artifacts. A unique name prevents deploy-pages from finding two
          # artifacts named "github-pages" in the same workflow run.
          name: github-pages-${{ github.run_attempt }}
          path: _site

  deploy:
    needs: [schedule-gate, update-and-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Verify published HTML and JSON match this run
        run: python -m scripts.verify_live_site

      - name: Record any collection failure after publishing available data
        if: needs.update-and-build.outputs.eu == 'failure' || needs.update-and-build.outputs.uk == 'failure'
        env:
          EU_OUTCOME: ${{ needs.update-and-build.outputs.eu }}
          UK_OUTCOME: ${{ needs.update-and-build.outputs.uk }}
          REFRESH_SLOT: ${{ needs.schedule-gate.outputs.slot }}
        run: |
          echo "::error::Quota collection was incomplete for ${REFRESH_SLOT:-manual refresh}. EU=$EU_OUTCOME UK=$UK_OUTCOME. Pages verified with last valid data for the failed source."
          exit 1
