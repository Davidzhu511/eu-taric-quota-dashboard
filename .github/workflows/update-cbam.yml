name: Update CBAM procurement dashboard data

on:
  workflow_dispatch:
  schedule:
    # Runs after the day's main EU ETS1 auctions. 17:30 UTC = 18:30 CET / 19:30 CEST.
    - cron: "30 17 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update_cbam_dashboard.py"
      - "scripts/update_cbam_dashboard_runner.py"
      - "scripts/ensure_cbam_research.py"
      - "tests/test_cbam_research_fallback.py"
      - "cbam/index.html"
      - "cbam/app.js"
      - "cbam/style.css"
      - "requirements.txt"
      - ".github/workflows/update-cbam.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Share the deployment lock with the quota dashboard workflow so two Pages
  # deployments never race each other.
  group: quota-dashboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate CBAM interactive price guide
        run: |
          node --check cbam/app.js
          python - <<'PY'
          from pathlib import Path
          html = Path('cbam/index.html').read_text(encoding='utf-8')
          js = Path('cbam/app.js').read_text(encoding='utf-8')
          css = Path('cbam/style.css').read_text(encoding='utf-8')
          for key in ('pricing-rules', 'official-2026-prices', 'example2026Price', 'example2026Cost'):
              assert key in html, f'pricing guide missing: {key}'
          assert 'const byQ=new Map((rows||[]).filter(x=>x.year===2026)' in js
          assert "'example2026Cost'" in js and "'example2026Price'" in js
          assert '.price-bucket-guide' in css and '.bucket-grid' in css
          print('CBAM pricing guide markup, dynamic bindings and JavaScript syntax validated')
          PY

      - name: Fetch EEX and Commission CBAM data
        run: python scripts/update_cbam_dashboard_runner.py

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('cbam/data/current.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['meta']['status'] in ('ok', 'degraded')
          assert d['meta'].get('checked_at')
          assert 'official_cbam_prices' in d
          assert 'auction_analytics' in d
          assert 'public_score' in d
          if d['meta']['status'] == 'ok':
              assert d['auction_analytics']['stats'].get('latest_price') is not None
          print('CBAM JSON validation OK')
          PY

      - name: Test CBAM fallback and research freshness guardrails
        run: python -m unittest discover -s tests -p "test_cbam_research_fallback.py" -v

      - name: Ensure independently updated research JSON every day
        run: python scripts/ensure_cbam_research.py

      - name: Validate public research status and no fabricated overlay
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          current = json.loads(Path("cbam/data/current.json").read_text(encoding="utf-8"))
          research = json.loads(Path("cbam/data/research.json").read_text(encoding="utf-8"))
          meta = research["meta"]
          for key in ("updated_at", "status", "confidence", "public_data_date"):
              assert meta.get(key), f"missing research metadata: {key}"
          assert meta["public_data_date"] == current["meta"]["data_date"]
          score = research.get("overlay_score")
          if score is None:
              print("Research overlay unscored: safe public-data-only mode")
          else:
              assert type(score) in (int, float) and 0 <= score <= 30
              assert meta["status"] in ("scored", "validated")
              assert meta["confidence"] in ("medium", "high")
          print("CBAM research JSON validation OK")
          PY

      - name: Commit refreshed CBAM data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cbam/data/current.json cbam/data/history cbam/data/research.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh CBAM procurement dashboard"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then
                break
              fi
              if [[ "$attempt" -eq 3 ]]; then exit 1; fi
            done
          fi

      - name: Verify pushed research file on remote main
        run: |
          git fetch origin main
          git show origin/main:cbam/data/research.json > /tmp/research-remote.json
          python - <<'PY'
          import json
          from pathlib import Path
          local = json.loads(Path("cbam/data/research.json").read_text(encoding="utf-8"))
          remote = json.loads(Path("/tmp/research-remote.json").read_text(encoding="utf-8"))
          assert local == remote, "research.json differs between local build and remote main"
          assert "meta" in remote and "overlay_score" in remote
          print("Remote main research.json verified")
          PY

      - name: Refresh checkout from remote main before Pages packaging
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Prepare complete static site
        run: |
          mkdir -p _site/data _site/cbam
          cp index.html _site/index.html
          cp uk.html _site/uk.html
          python scripts/inject_uk_nav.py _site/index.html
          cp quarterly-summary.js quarterly-summary.css _site/
          python scripts/build_english_pages.py _site
          cp -R data/. _site/data/
          cp -R cbam/. _site/cbam/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-cbam-${{ github.run_attempt }}
          path: _site

  deploy:
    needs: update-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy complete site including CBAM dashboard
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-cbam-${{ github.run_attempt }}
