name: Recover missing EU and UK quota refreshes and publication

on:
  workflow_dispatch:
  schedule:
    - cron: "37 8,12,15,17 * * *"
      timezone: Europe/Berlin

permissions:
  contents: read
  actions: write

concurrency:
  group: quota-freshness-watchdog
  cancel-in-progress: false

jobs:
  check-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Dispatch recovery only for an incomplete refresh or publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          plan="$(python -m scripts.dashboard_health --verify-publication)"
          {
            echo "### EU and UK quota recovery"
            echo "$plan"
          } >> "$GITHUB_STEP_SUMMARY"
          if ! grep -qx 'publish=true' <<< "$plan"; then
            exit 0
          fi

          # Do not create duplicate runs during an active scrape/deploy or
          # retry indefinitely against a temporarily unavailable EU endpoint.
          gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow update-and-deploy.yml --branch main --limit 60 \
            --json status,createdAt,conclusion > "$RUNNER_TEMP/quota-workflow-runs.json"

          if python -m scripts.quota_retry_guard "$RUNNER_TEMP/quota-workflow-runs.json"; then
            echo "- Result: retry deferred (active workflow or daily cap reached)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # GITHUB_TOKEN may dispatch workflow_dispatch without another model or server.
          gh workflow run update-and-deploy.yml --ref main --repo "$GITHUB_REPOSITORY" -f recovery=true
          echo "- Result: dispatched targeted recovery via GitHub Actions" >> "$GITHUB_STEP_SUMMARY"
