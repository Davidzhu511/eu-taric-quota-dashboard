name: Recover missing daily EU and UK quota snapshots

on:
  workflow_dispatch:
  schedule:
    # UTC slots cover approximately 08:17 and 09:17 Berlin, including DST.
    # They provide an independent fallback when the primary cron event is missed.
    - cron: "17 6,7,8 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: quota-freshness-watchdog
  cancel-in-progress: false

jobs:
  check-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Dispatch primary workflow only for missing data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          berlin_today="$(TZ=Europe/Berlin date +%F)"
          berlin_hhmm="$(TZ=Europe/Berlin date +%H%M)"
          echo "### Quota freshness fallback" >> "$GITHUB_STEP_SUMMARY"
          echo "- Berlin date: $berlin_today" >> "$GITHUB_STEP_SUMMARY"

          # A summer/winter UTC candidate can arrive before the primary refresh.
          if (( 10#$berlin_hhmm < 815 )); then
            echo "- Result: before 08:15 Berlin; no recovery needed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Validate actual snapshots, not merely the apparent success of a cron run.
          if python scripts/dashboard_health.py --complete-on "$berlin_today"; then
            echo "- Result: EU 55/55 and UK 5/5 are fresh and clean" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Do not create duplicate runs while the original scrape/deploy is active.
          gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow update-and-deploy.yml --branch main --limit 20 \
            --json status,createdAt > "$RUNNER_TEMP/quota-workflow-runs.json"

          if python - "$RUNNER_TEMP/quota-workflow-runs.json" <<'PY'
          import json
          import sys
          from datetime import datetime, timedelta, timezone

          now = datetime.now(timezone.utc)
          recent = now - timedelta(minutes=90)
          active_statuses = {"queued", "requested", "waiting", "pending", "in_progress"}
          runs = json.load(open(sys.argv[1], encoding="utf-8"))
          for run in runs:
              stamp = run.get("createdAt") or ""
              try:
                  created = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
              except ValueError:
                  continue
              if run.get("status") in active_statuses and recent <= created <= now:
                  print("A quota workflow is already queued or running:", stamp)
                  sys.exit(0)
          sys.exit(1)
          PY
          then
            echo "- Result: existing fresh quota workflow is pending/running; no duplicate" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # GITHUB_TOKEN may dispatch workflow_dispatch without another model or server.
          gh workflow run update-and-deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
          echo "- Result: dispatched missing daily refresh via GitHub Actions" >> "$GITHUB_STEP_SUMMARY"
